dependencies = []

[package]
name = "Tabyrus"
version = "0.2.0"
description = "AI-powered system-wide autocomplete for macOS with Rust+MLX backend"

[app]
bundle_id = "com.tabyrus.app"
deployment_target = "14.0"
sources = "src"
resources = []
frameworks = ["AppKit", "ApplicationServices", "Combine", "SwiftUI"]
linker_flags = ["-Ltarget/debug", "-ltabyrus_backend"]
swift_flags = []

[app.info]
CFBundleName = "Tabyrus"
CFBundleDisplayName = "Tabyrus"
CFBundleIdentifier = "com.tabyrus.app"

[build]
architectures = ["arm64"]
platform = "macos"
prebuild = "cargo build"

[signing]
identity = "-"
hardened_runtime = false
notarize = false

[test]
sources = "Tests"
xctest = false

[archive]
zip = false
