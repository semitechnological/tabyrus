[package]
name = "tabyrus-backend"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "tabyrus_backend"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
num_cpus = "1.17"
hf-hub = { version = "0.5", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
dirs = "5.0"
thiserror = "1.0"
ureq = { version = "2.9", features = ["json"] }
walkdir = "2.4"
eqswift = "0.1.1"
aurorality-core = { git = "https://github.com/tschk/aurorality.git", rev = "49984c2dbbc1454a866267c22c7b81132f6ca50b", version = "0.1.0" }

[features]
default = ["mlx"]
mlx = []

[profile.release]
opt-level = 3
lto = true
